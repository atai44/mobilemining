name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Source files (dictionaries, models) are cached between runs: refreshed weekly, and the last
      # good copy is used if a download server is down.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: sources
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/models
          key: sources-${{ steps.week.outputs.week }}
          restore-keys: sources-
      # Downloads PP-OCRv6 models (Hugging Face) and builds JMdict/KANJIDIC2 (EDRDG)
      - run: npm run setup
        env:
          DICT_REFRESH: ${{ steps.sources.outputs.cache-hit != 'true' && '1' || '0' }}
      - run: npm run build
      # Android app: the same build wrapped with Capacitor (android/), plus the AnkiDroid plugin.
      # Published on the site as mobilemining.apk and as a GitHub Release. A failure here doesn't
      # block the site.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Android app
        id: apk
        continue-on-error: true
        run: |
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleRelease -PmmVersionCode=${{ github.run_number }} -PmmVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../dist/mobilemining.apk
          ls -la ../dist/mobilemining.apk
      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with:
          name: apk
          path: dist/mobilemining.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The APK as a GitHub Release (for Obtainium and direct downloads)
  release:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - run: >
          gh release create "v1.0.${{ github.run_number }}" mobilemining.apk
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "MobileMining for Android 1.0.${{ github.run_number }}"
          --notes "Install mobilemining.apk on Android (AnkiDroid must be installed first). Built from ${GITHUB_SHA::7}."
        env:
          GH_TOKEN: ${{ github.token }}
